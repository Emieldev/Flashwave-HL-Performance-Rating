# Tests, lints and type-checks every push and pull request, on Windows and
# on Linux: the app ships for both.
name: CI

on:
  push:
    branches: [main, flashy-dev, contributors]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: System libraries for the window
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libgtk-3-dev libsoup-3.0-dev

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            ui/package-lock.json

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: swatinem/rust-cache@v2

      # Type-checks the frontend, and builds ui/dist, which the app crate
      # embeds: without it the Rust workspace does not compile. The root
      # install is needed too: the updater and process plugins the UI
      # imports are declared there (CI failed on exactly that from 0.6.0).
      - name: Frontend build
        run: |
          npm ci
          npm ci --prefix ui
          npm run build --prefix ui

      - name: Rust tests
        run: cargo test --workspace

      # Long types and long argument lists are left to taste: Rust 1.98's
      # clippy started failing on fourteen of them across the project.
      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings -A clippy::type_complexity -A clippy::too_many_arguments
