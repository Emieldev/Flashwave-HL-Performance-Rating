[package]
name = "hl-app"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Team Fortress 2 Highlander performance rating system"

[lib]
name = "hl_app_lib"
# No "staticlib": it is for iOS, and on the desktop it only wrote a 1.9 GB
# hl_app_lib.lib on every debug build.
crate-type = ["cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
hl-core.workspace = true
hl-db.workspace = true
hl-ingest.workspace = true
hl-rating.workspace = true

tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"

anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tauri-plugin-process = "2"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
